ssion is the request for one.","note_zh":"目前没有可依托的插件 API，这条讨论本身就是在要一个。"},"review":{"value":"high","reasons":"Highest upvote count among the platform ideas (24 upvotes, 7 comments), and two later posts propose concrete designs, an RFC and a runnable prototype. docs/user on main still describe no plugin API.","reasons_zh":"平台类想法里 upvote 最多（24 个 upvote、7 条评论），后来又有两条帖子给出具体设计，一份 RFC 和一个可运行的原型。上游 main 的 docs/user 仍没有插件 API。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"extension-hooks-settings-ui","title":"Lifecycle hooks, settings and UI contributions for extensions","title_zh":"扩展的生命周期钩子、设置与界面贡献","problem":"Asks for a Pi-style extension API where integrations react to app and agent lifecycle events such as a turn settling, expose their own settings, and add small UI pieces like a status indicator, so no fork is needed. Two later posts ask for a hook at one moment, settling a thread, beyond the runOnSettle action that only runs for worktree threads.","problem_zh":"希望有 Pi 式的扩展 API：集成能响应应用和 Agent 的生命周期事件（比如一个回合结束），带自己的设置，并加入状态指示这类小界面，不用 fork。后来有两条帖子单独要求在“线程结束”这个时点挂钩子，超出了只对工作树线程生效的 runOnSettle 动作。","category":"platform","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/6837","title":"[Feature]: Pi-style extension API for lifecycle hooks, UI contributions, and settings","date":"2026-07-30"},{"url":"https://github.com/pingdotgg/t3code/discussions/19004","title":"Run a configurable prompt or skill when settling a thread","date":"2026-10-13"},{"url":"https://github.com/pingdotgg/t3code/discussions/22320","title":"Pre- and post-settle hooks for any thread, including ones T3 doesn't manage a worktree for","date":"2026-10-20"},{"url":"https://github.com/pingdotgg/t3code/discussions/31472#discussioncomment-19462189","title":"Right-panel registry as a first plugin slice (comment by CantrellJax on #31472)","date":"2026-11-07"},{"url":"https://github.com/pingdotgg/t3code/discussions/14938","title":"Proposal: a small internal registry for right-panel 26-11-09"}],"demand":{"basis":"discussion","upvotes":77,"comments":1,"url":"https://github.com/pingdotgg/t3code/discussions/33424","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"Custom CSS is styling only (docs/user/appearance.md). Effects driven by keystrokes need script access to the page; CSS animations could only approximate them.","note_zh":"Custom CSS 只管样式（docs/user/appearance.md）。由按键驱动的效果需要能访问页面脚本；CSS 动画只能近似。"},"review":{"value":"medium","reasons":"77 upvotes but one comment, the highest upvote count of any idea here, and its author offers to upstream it. Purely cosmetic, so a good test of a script-level plugin API but small daily value for most users (inference).","reasons_zh":"77 个 upvote 但只有一条评论，是这里 upvote 最多的想法，作者也愿意提交到上游。纯装饰性，适合用来检验能执行脚本的插件 API，对多数用户日常价值不大（推断）。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"collapse-mcp-app-cards","title":"Collapse or hide inline MCP app cards per server","title_zh":"按服务器折叠或隐藏对话内的 MCP 应用卡片","problem":"MCP apps render inline in Claude threads, and the report shows a Jira app asking for cards up to 2,000px tall with no collapse control. Two discussions ask for a per-server collapse-by-default or a hide option.","problem_zh":"MCP 应用会在 Claude 线程里内联渲染，报告里一个 Jira 应用要求高达 2,000px 的卡片，而且没有折叠控制。两条讨论都要求按服务器默认折叠，或提供隐藏选项。","category":"ui-surfaces","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/31591","title":"Per-server \"collapse by default\" for MCP Apps (Atlassian's Jira cards take over Claude threads)","date":"2026-11-05"},{"url":"https://github.com/pingdotgg/t3code/discussions/30907","title":"Allow collapsing or hiding inline MCP app cards while keeping the connector enabled","date":"2026-11-04"}],"demand":{"basis":"discussion","upvotes":9,"comments":4,"url":"https://github.com/pingdotgg/t3code/discussions/31591","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"Custom CSS could only help if cards carried a stable data attribute. In apps/web/src/components/chat/McpAppFrame.tsx on main (read 2026-11-19) the only one is data-mcp-app-fullscreen, so it is not dependable.","note_zh":"只有卡片带稳定的 data 属性时，Custom CSS 才帮得上忙。2026-11-19 读 main 上的 apps/web/src/components/chat/McpAppFrame.tsx，唯一的属性是 data-mcp-app-fullscreen，不可靠。"},"review":{"value":"low","reasons":"Two discussions with 9 upvotes each (4 and 1 comments). It fixes a real annoyance with tall MCP app cards, but it is a per-server display setting that fits core better than a plugin (inference); docs/user describe no collapse control (html-renders.md).","reasons_zh":"两条讨论各 9 个 upvote（4 条和 1 条评论）。它解决的是高大的 MCP 应用卡片这个实际麻烦，但属于按服务器的显示设置，放核心比做插件更合适（推断）；docs/user 没有折叠控制（html-renders.md）。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"menu-bar-status","title":"System tray or menu-bar icon for background status","title_zh":"系统托盘或菜单栏状态图标","problem":"With T3 Code running in the background there is no system-level indicator of whether it, its backend and the local T3 Connect environment are still up. The request is a tray or menu-bar icon with status and basic controls.","problem_zh":"T3 Code 在后台运行时，没有系统级指示告诉你它、它的后端和本地 T3 Connect 环境是否还在运行。请求是做一个托盘或菜单栏图标，显示状态并提供基本控制。","category":"ui-surfaces","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/6889","title":"[Feature]: Add a system tray or menu-bar icon for background status and controls","date":"2026-08-06"},{"url":"https://github.com/pingdotgg/t3code/discussions/6837#discussioncomment-19383921","title":"Per-project waiting-on-you card (comment by Anneo22 on #6837)","date":"2026-11-03"},{"url":"https://github.com/pingdotgg/t3code/discussions/6837#discussioncomment-19273919","title":"Action list and coordinator dashboard (comment by P4rcev4l on #6837)","date":"2026-10-29"}],"demand":{"basis":"discussion","upvotes":33,"comments":19,"url":"https://github.com/pingdotgg/t3code/discussions/6889","as_of":"2026-11-19"},"mount_today":{"type":"mcp","note":"A separate companion app can read thread status over the official MCP server, as the t3buddy README (read 2026-11-19) describes for a desktop HUD. Lifecycle controls such as stopping the server are not among the tools listed in docs/user/outside-agents.md.","note_zh":"独立的伴侣应用可以经官方 MCP 服务器读取线程状态，t3buddy 的 README（2026-11-19 读取）就是这样描述桌面 HUD 的。停止服务器这类生命周期控制不在 docs/user/outside-agents.md 列出的工具里。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/outside-agents.md"},"review":{"value":"high","reasons":"33 upvotes and 19 comments. A companion app that reads thread state over the official MCP server already exists (t3buddy, works-today.md), so a first version needs no plugin API.","reasons_zh":"33 个 upvote、19 条评论。经官方 MCP 服务器读线程状态的伴侣应用已经存在（t3buddy，见 works-today.md），做第一版不需要插件 API。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"git-history-view","title":"Git history view for the active project","title_zh":"当前项目的 Git 历史视图","problem":"There is no obvious way to browse past commits inside T3 Code. The request lists a commit list with author and date, the files changed by a commit, and a diff, starting from local history only.","problem_zh":"在 T3 Code 里没有明显的办法浏览以往的提交。请求列出：带作者和日期的提交列表、某次提交改动的文件，以及 diff，先只做本地历史。","category":"git","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/6943","title":"[Feature]: Add a Git history view","date":"2026-08-11"},{"url":"https://github.com/pingdotgg/t3code/discussions/15187","title":"Review and act on working trees, branches and remotes from a Version Control panel","date":"2026-10-03"},{"url":"https://github.com/pingdotgg/t3code/discussions/12246","title":"[Feature] Project Overview - Git Branches, Threads, and Worktrees Visualization","date":"2026-09-17"}],"demand":{"basis":"discussion","upvotes":20,"comments":8,"url":"https://github.com/pingdotgg/t3code/discussions/6943","as_of":"2026-11-19"},"mount_today":{"type":"standalone-page","note":"A separate local page can read git log and diffs itself and use the project list from the official MCP server. Whether it can be opened inside T3, for example in its browser panel, was not tested.","note_zh":"独立的本地页面可以自己读 git log 和 diff，并用官方 MCP 服务器给出的项目列表。能否在 T3 里打开它（比如放进浏览器面板）没有测试。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/outside-agents.md"},"review":{"value":"medium","reasons":"20 upvotes, 8 comments. A separate page can read git itself, so it is buildable now; docs/user describe commit links opening in the Diff pane (source-control.md) but no history browser.","reasons_zh":"20 个 upvote、8 条评论。独立页面可以自己读 git，现在就能做；docs/user 里提交链接能在 Diff 面板打开（source-control.md），但没有历史浏览器。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"skill-manager","title":"Skill manager across every provider's skill folders","title_zh":"跨各提供方 skill 目录的 Skill 管理","problem":"Skills live in different directories per provider, so users end up with duplicated copies that drift or skills only one provider sees. T3 already scans these locations for the $ picker but offers no way to see the gaps. A second post proposes a central store routed to each provider with symlinks.","problem_zh":"各提供方的 Skill 放在不同目录，用户最后得到会各自漂移的重复副本，或只有一个提供方能看到的 Skill。T3 已经为 $ 选择器扫描这些位置，却没有办法看出缺口。另一条帖子提议建一个中央库，再用符号链接分发给各提供方。","category":"skills-mcp","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/15823","title":"Skill manager: view, add, edit, and link skills across every harness","date":"2026-10-05"},{"url":"https://github.com/pingdotgg/t3code/discussions/7334","title":"[Feature] Manage skills and agents from T3, route to providers via symlinks","date":"2026-08-17"}],"demand":{"basis":"discussion","upvotes":24,"comments":7,"url":"https://github.com/pingdotgg/t3code/discussions/15823","as_of":"2026-11-19"},"mount_today":{"type":"skill","note":"A Skill can tell an agent to scan the skill folders the issue lists and report duplicates and drift. It is a report, not an editing UI. T3 lists skills enabled for the provider via the $ picker (docs/user/composer.md).","note_zh":"Skill 可以让 Agent 扫描 issue 里列出的 Skill 目录并报告重复和漂移，但那是报告，不是编辑界面。T3 通过 $ 选择器列出对该提供方启用的 Skill（docs/user/composer.md）。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/composer.md"},"review":{"value":"high","reasons":"24 upvotes, 7 comments, plus a second post (5 upvotes). The duplicated-skill problem is concrete, and a Skill or a standalone tool can start on it today (composer.md); docs/user describe no cross-provider skill view.","reasons_zh":"24 个 upvote、7 条评论，另有一条帖子（5 个 upvote）。Skill 重复的问题很具体，Skill 或独立工具现在就能着手（composer.md）；docs/user 里没有跨提供方的 Skill 视图。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"project-memory","title":"Provider-neutral project memory that agents write and you can inspect","title_zh":"各提供方通用、可查看可删除的项目记忆","problem":"Each provider keeps its own memory or only instruction files, so what an agent learned does not survive a new thread or a provider switch. The T3 MCP server has thread and project tools but nothing that persists notes.","problem_zh":"每个提供方各有自己的记忆，或只有指令文件，所以 Agent 学到的东西换新线程或换提供方就没了。T3 的 MCP 服务器有线程和项目工具，却没有保存笔记的功能。","category":"skills-mcp","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/15858","title":"Project memory that agents can write, recall, and you can see and delete","date":"2026-10-05"}],"demand":{"basis":"discussion","upvotes":13,"comments":7,"url":"https://github.com/pingdotgg/t3code/discussions/15858","as_of":"2026-11-19"},"mount_today":{"type":"mcp","note":"A notes MCP server added to the provider gives agents write and recall tools today; restart the agent session after adding it (docs/user/composer.md). Viewing and deleting notes would be through that server, not a T3 screen.","note_zh":"给提供方加一个笔记类 MCP 服务器，现在就能给 Agent 提供写入和回忆的工具，加完后重启 Agent 会话（docs/user/composer.md）。查看和删除笔记要通过那个服务器，而不是 T3 的界面。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/composer.md"},"review":{"value":"medium","reasons":"13 upvotes, 7 comments. The MCP route already works with existing notes servers (composer.md), which lowers the gain from a plugin; what is missing is a T3 screen to view and delete notes.","reasons_zh":"13 个 upvote、7 条评论。MCP 路线已经能用现成的笔记类服务器（composer.md），所以做成插件的增益有限；缺的是在 T3 里查看和删除笔记的界面。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"read-aloud","title":"Read assistant replies aloud","title_zh":"朗读助手回复","problem":"Asks for a per-message read-aloud action using the browser speech API or an optional cloud voice, for reading while away from the screen. A later commenter on the extension-API thread also lists read-aloud of replies. A mobile post asks for the same with background playback.","problem_zh":"希望每条消息有“朗读”操作，用浏览器的语音 API 或可选的云端语音，方便离开屏幕时听。扩展 API 帖子下的一位评论者也列了朗读回复。另有一条帖子要求在手机端做同样的事，并支持后台播放。","category":"ui-surfaces","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/6762","title":"[Feature]: Read AI responses aloud via built-in TTS (per-message \"read aloud\" action)","date":"2026-07-14"},{"url":"https://github.com/pingdotgg/t3code/discussions/6837#discussioncomment-19273919","title":"Read-aloud of replies as an extension use case (comment by P4rcev4l on #6837)","date":"2026-10-29"},{"url":"https://github.com/pingdotgg/t3code/discussions/12622","title":"[Feature]: Read agent responses aloud on mobile with background TTS","date":"2026-09-19"}],"demand":{"basis":"discussion","upvotes":31,"comments":16,"url":"https://github.com/pingdotgg/t3code/discussions/6762","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"A per-message button needs a UI hook. An MCP app (docs/user/html-renders.md) could speak text it is handed, but whether its sandbox allows speech synthesis was not tested.","note_zh":"逐条消息的按钮需要界面钩子。MCP 应用（docs/user/html-renders.md）也许能朗读交给它的文字，但它的沙箱是否允许语音合成没有测试。"},"review":{"value":"high","reasons":"31 upvotes and 16 comments, plus a mobile post with 12 upvotes and 8 comments; docs/user describe no read-aloud for replies. Inference: a per-message action is a natural plugin, and it helps ordinary users who read away from the screen.","reasons_zh":"31 个 upvote、16 条评论，另有一条手机端帖子（12 个 upvote、8 条评论）；docs/user 没有朗读回复的功能。推断：逐条消息的操作很适合做成插件，对离开屏幕阅读的普通用户有用。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"thread-cost-breakdown","title":"Token usage and estimated cost per thread","title_zh":"按线程显示 token 用量与估算费用","problem":"Asks for each thread to show total tokens split into input, output and cache, an estimated API cost marked as not a bill, and a per-model breakdown. The Usage page documents per-model breakdowns; thread-level totals are not described there.","problem_zh":"希望每个线程显示总 token 数（拆成输入、输出和缓存）、标明“不是账单”的估算 API 费用，以及按模型的明细。Usage 页文档里有按模型的明细，没有线程级的合计。","category":"usage-cost","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/13073","title":"Show token usage and estimated cost per thread","date":"2026-09-22"},{"url":"https://github.com/pingdotgg/t3code/discussions/30930","title":"Per-thread cost and budgets for Claude instances behind a LiteLLM proxy, read from the proxy's API","date":"2026-11-04"}],"demand":{"basis":"discussion","upvotes":24,"comments":12,"url":"https://github.com/pingdotgg/t3code/discussions/13073","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"Per-thread numbers sit in provider history that T3 reads for the Usage page (docs/user/usage.md); docs/user/outside-agents.md does not list a usage tool.","note_zh":"按线程的数字在 T3 读取给 Usage 页用的提供方历史里（docs/user/usage.md）；docs/user/outside-agents.md 没有列出用量工具。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/usage.md"},"review":{"value":"medium","reasons":"24 upvotes, 12 comments. Usage already shows estimated cost by model and lets you set custom prices (usage.md), but docs/user describe no per-thread total, so part of the ask is open. It reads T3's own data, so core may fit better than a plugin (inference).","reasons_zh":"24 个 upvote、12 条评论。Usage 已经按模型显示估算费用，也能设自定义价格（usage.md），但 docs/user 没有线程级合计，所以这条还有一部分没满足。它读的是 T3 自己的数据，放核心可能比做插件合适（推断）。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"provider-usage-via-mcp","title":"Expose remaining provider quota through the MCP server","title_zh":"通过 MCP 服务暴露各提供方剩余额度","problem":"With several Codex and Claude accounts, the author wants the MCP server to list each account's remaining 5-hour and weekly quota so an orchestrating agent can delegate to the account with the most left. A second post asks for the same data in orchestrator_capabilities. Counts not added.","problem_zh":"有多个 Codex 和 Claude 账号时，作者希望 MCP 服务器列出每个账号剩余的 5 小时和每周额度，好让负责编排的 Agent 把任务派给剩得最多的账号。另一条帖子要求在 orchestrator_capabilities 里给出同样的数据。","category":"usage-cost","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/15137","title":"Expose the current provider usage via mcp","date":"2026-10-03"},{"url":"https://github.com/pingdotgg/t3code/discussions/16187","title":"Show provider usage limits in orchestrator_capabilities so agents can avoid rate-limited providers","date":"2026-10-05"},{"url":"https://github.com/pingdotgg/t3code/discussions/15846","title":"Option to automatically hand off to a fallback provider when hitting usage limits","date":"2026-10-05"},{"url":"https://github.com/pingdotgg/t3code/discussions/6923","title":"[Feature]: Auto-select the account with the most remaining quota before starting a task","date":"2026-08-09"}],"demand":{"basis":"discussion","upvotes":23,"comments":12,"url":"https://github.com/pingdotgg/t3code/discussions/15137","as_of":"2026-11-23"},"mount_today":{"type":"needs-plugin-api","note":"It needs a new tool on T3's own MCP server; docs/user/outside-agents.md lists projects, threads, providers and models, not quota.","note_zh":"这需要在 T3 自己的 MCP 服务器上加新工具；docs/user/outside-agents.md 列的是项目、线程、提供方和模型，没有额度。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/outside-agents.md"},"review":{"value":"medium","reasons":"23 upvotes, 12 comments (was 16 and 7 on 2026-11-19), plus a second post asking for the same data in orchestrator_capabilities. docs/user/outside-agents.md still lists projects, threads, providers and models, not quota (read 2026-11-23). It is a small addition to T3's own MCP server, and quota-aware routing depends on it (inference).","reasons_zh":"23 个 upvote、12 条评论（2026-11-19 时为 16 和 7），另有一条帖子要求在 orchestrator_capabilities 里给出同样的数据。docs/user/outside-agents.md 仍只列项目、线程、提供方和模型，没有额度（2026-11-23 核对）。这是给 T3 自己的 MCP 服务器加个小功能，按额度选提供方以它为前提（推断）。","as_of":"2026-11-23","action":"keep"},"status":"open"},{"slug":"watch-command","title":"Wake a thread when a watched command prints something","title_zh":"被监视命令有输出时唤醒线程","problem":"Pull-request watching exists, but nothing like it for other waits such as a discussion reply or a deploy. The author's workaround is an external cron job that sends a message into the thread, which T3 cannot see or stop. A second post asks for the same wait on a GitHub Actions run, such as a post-merge deploy.","problem_zh":"拉取请求的监视已经有了，但其他等待（比如一条讨论回复或一次部署）没有类似的机制。作者的变通办法是用外部 cron 往线程里发消息，T3 既看不到也停不了它。另一条帖子要求对一次 GitHub Actions 运行做同样的等待，比如合并后的部署。","category":"orchestration","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/19879","title":"Wake a thread when a command prints something (`watch_command`)","date":"2026-10-15"},{"url":"https://github.com/pingdotgg/t3code/discussions/16793","title":"Watch a GitHub Actions workflow run (e.g. a post-merge deploy) like watch_pull_request","date":"2026-10-07"}],"demand":{"basis":"discussion","upvotes":9,"comments":12,"url":"https://github.com/pingdotgg/t3code/discussions/19879","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"A script on the host can already message a thread with t3 thread send (docs/user/outside-agents.md), which is the discussion's workaround. T3 still cannot show or cancel the watch.","note_zh":"宿主上的脚本现在就能用 t3 thread send 给线程发消息（docs/user/outside-agents.md），这就是讨论里的变通办法。T3 仍然无法显示或取消这个监视。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/outside-agents.md"},"review":{"value":"medium","reasons":"9 upvotes, 12 comments, plus a second post (3 upvotes) for GitHub Actions runs. The workaround, a host script calling t3 thread send, works today, so what is missing is only T3 showing and cancelling the watch.","reasons_zh":"9 个 upvote、12 条评论，另有一条帖子（3 个 upvote）针对 GitHub Actions 运行。变通办法，也就是宿主脚本调用 t3 thread send，现在就能用，所以缺的只是 T3 显示和取消这个监视。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"thread-groups-colors","title":"Manual, collapsible thread groups with optional colors","title_zh":"可手动分组、可折叠并带颜色的线程组","problem":"A project is not always the right organizing unit, so the request is user-created named groups inside a project, collapsible, with optional colors and an activity indicator on a collapsed group. The sidebar docs list a group-by-project mode (docs/user/thread-sidebar.md), which is not manual grouping.","problem_zh":"项目不总是合适的组织单位，所以请求在项目内加用户自建的命名分组，可折叠、可选颜色，折叠的分组上有活动指示。侧边栏文档里有按项目分组的模式（docs/user/thread-sidebar.md），但那不是手动分组。","category":"sidebar","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/11998","title":"Manual, collapsible thread groups with optional colors","date":"2026-09-16"}],"demand":{"basis":"discussion","upvotes":51,"comments":15,"url":"https://github.com/pingdotgg/t3code/discussions/11998","as_of":"2026-11-23"},"mount_today":{"type":"needs-plugin-api","note":"Groups need stored data and sidebar logic; Custom CSS cannot know which thread belongs to which group.","note_zh":"分组需要保存数据和侧边栏逻辑；Custom CSS 无从知道哪个线程属于哪个分组。"},"review":{"value":"medium","reasons":"51 upvotes and 15 comments (was 46 and 13 on 2026-11-19), still the second highest upvote count here after shader-feedback-effects. docs/user still list only the group-by-project beta (thread-sidebar.md, read 2026-11-23). It needs sidebar internals, so upstream may build it as a core feature (inference).","reasons_zh":"51 个 upvote、15 条评论（2026-11-19 时为 46 和 13），仍是全表第二高，仅次于 shader-feedback-effects。docs/user 仍只有按项目分组的测试版（thread-sidebar.md，2026-11-23 核对）。它要用到侧边栏内部逻辑，上游可能直接做成核心功能（推断）。","as_of":"2026-11-23","action":"keep"},"status":"open"},{"slug":"pin-agent-responses","title":"Pin agent responses in a thread and jump between pins","title_zh":"在线程中固定回复并在固定项间跳转","problem":"Long threads bury the few answers that matter, such as the agreed plan or a root cause. The request is a pin action on a message, a per-thread pin list, and next and previous pin keybindings.","problem_zh":"长线程会把少数重要的回答埋掉，比如商定的方案或根因。请求是给消息加“固定”操作、每个线程一个固定列表，以及上一条、下一条固定项的快捷键。","category":"ui-surfaces","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/16153","title":"Pin agent responses in a thread and jump between pins","date":"2026-10-05"}],"demand":{"basis":"discussion","upvotes":11,"comments":5,"url":"https://github.com/pingdotgg/t3code/discussions/16153","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"No documented open entry adds a per-message action or stores a pin list.","note_zh":"文档里没有哪个开放入口能加逐条消息的操作或保存固定列表。"},"review":{"value":"medium","reasons":"11 upvotes, 5 comments. It needs a per-message action and a stored list, which fits a UI-hook plugin; docs/user describe no pinning of messages.","reasons_zh":"11 个 upvote、5 条评论。它需要逐条消息的操作和一个保存的列表，适合做成界面钩子类插件；docs/user 没有固定消息的功能。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"sandbox-environment-providers","title":"On-demand cloud sandbox environments through pluggable providers","title_zh":"按需创建云端沙箱环境的可插拔提供方","problem":"Asks for environments created on demand for each task or worktree through a user-configured sandbox broker or per-backend drivers (Boat, Daytona and similar), so no always-on server has to be kept. T3 would then connect through its existing remote or pairing flow. Three separate posts describe the same need, the third for one-click Docker Sandbox environments; counts are not added.","problem_zh":"希望为每个任务或工作树按需创建环境，通过用户配置的沙箱代理或各后端的驱动（Boat、Daytona 等），不用常驻服务器。T3 再经现有的远程或配对流程连上去。三条帖子描述同一个需求，第三条要的是一键创建 Docker Sandbox 环境；数字不相加。","category":"platform","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/18019","title":"[Feature]: On-demand cloud task environments through an external sandbox broker","date":"2026-10-02"},{"url":"https://github.com/pingdotgg/t3code/discussions/27949","title":"Provision sandbox environments from Settings (Boat, Daytona, Vercel, Upstash, Celesto + any driver)","date":"2026-10-31"},{"url":"https://github.com/pingdotgg/t3code/discussions/7841","title":"Idea: one-click Docker Sandbox (sbx) environments in Settings → Connections","date":"2026-08-21"}],"demand":{"basis":"discussion","upvotes":18,"comments":11,"url":"https://github.com/pingdotgg/t3code/discussions/18019","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"The user docs read for this list describe connecting to environments that already exist; none describes a hook for provisioning one. Not checked exhaustively.","note_zh":"为这份清单读过的用户文档只描述连接已存在的环境，没有哪条描述了创建环境的钩子。没有穷尽检查。"},"review":{"value":"high","reasons":"Three posts ask for it: 18 upvotes and 11 comments, 14 upvotes and 12 comments, and a Docker Sandboxes post with 18 upvotes and 10 comments, which notes that connecting over SSH already works. Provider drivers are the kind of thing a plugin API is for (inference).","reasons_zh":"三条帖子都在要：18 个 upvote、11 条评论；14 个 upvote、12 条评论；以及一条 Docker Sandboxes 帖子，18 个 upvote、10 条评论，并指出走 SSH 连接现在就能用。提供方驱动正是插件 API 该承载的东西（推断）。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"workspace-providers","title":"Pluggable workspace providers instead of a fixed git worktree","title_zh":"可插拔的工作区提供方（不止 git worktree）","problem":"Asks for pluggable create and remove commands for a thread's isolated workspace, for example copy-on-write clones or Worktrunk, with support for non-git directories and cleanup when a thread settles. A second post offers a Worktrunk integration as an optional worktree manager. A third post proposes copy-on-write clones instead of git worktrees.","problem_zh":"希望线程隔离工作区的创建和删除命令可插拔，比如写时复制克隆或 Worktrunk，支持非 git 目录，并在线程结束时清理。第二条帖子提出把 Worktrunk 集成作为可选的工作树管理器，第三条提出用写时复制克隆代替 git worktree。","category":"git","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/11266","title":"Workspace providers: pluggable create/remove commands (rift, CoW clones, Worktrunk), with support for non-git directories and cleanup on settle","date":"2026-09-11"},{"url":"https://github.com/pingdotgg/t3code/discussions/8953","title":"Should I submit my Git/worktree workflow improvements to upstream?","date":"2026-08-31"},{"url":"https://github.com/pingdotgg/t3code/discussions/10853","title":"Copy-on-write workspace clones as an alternative to Git worktrees","date":"2026-09-08"}],"demand":{"basis":"discussion","upvotes":15,"comments":4,"url":"https://github.com/pingdotgg/t3code/discussions/11266","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"No documented entry replaces how a thread's workspace is created.","note_zh":"文档里没有能替换线程工作区创建方式的入口。"},"review":{"value":"medium","reasons":"Two posts with 15 upvotes each (4 and 8 comments) plus a copy-on-write post (6 upvotes). docs/user describe an opt-in fast worktree checkout beta on macOS (project-settings.md), which speeds up worktrees but does not make the workspace pluggable.","reasons_zh":"两条帖子各 15 个 upvote（4 条和 8 条评论），另有一条写时复制的帖子（6 个 upvote）。docs/user 有 macOS 上可选的快速工作树检出测试版（project-settings.md），它让工作树更快，但没有让工作区可插拔。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"outbound-lifecycle-webhooks","title":"Outbound webhooks and local hooks for turn and thread events","title_zh":"回合与线程事件的外发 webhook 与本地钩子","problem":"Asks for a user-configurable outbound callback when a turn or thread reaches a terminal state, so supervisors, CI or local notifiers (sound or desktop alerts) can react. Scheduled tasks can already be triggered by an inbound webhook; this is the opposite direction. docs/user/outside-agents.md now describes MCP Events so a bot can poll, stream or receive by webhook when a turn ended, an agent waits, a guest asked, a watched pull request woke its thread, or a workflow run changed. What remains is a simple settings URL or a local process hook that does not speak MCP Events.","problem_zh":"希望有用户可配置的外发回调，在回合或线程到达终态时触发，让监督程序、CI 或本地通知器（声音或桌面提醒）能做出反应。定时任务已经能被入站 webhook 触发，这里是相反的方向。docs/user/outside-agents.md 现在写了 MCP Events：机器人可以轮询、流式接收或经 webhook 得知回合结束、Agent 在等人、访客提问、被监视的拉取请求唤醒了线程，或工作流运行有变化。还缺的是不讲 MCP Events 协议的简单设置项 URL 或本地进程钩子。","category":"orchestration","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/6933","title":"Feature: configurable outbound completion webhook for turn/thread terminal events","date":"2026-08-10"},{"url":"https://github.com/pingdotgg/t3code/discussions/6686","title":"Feature request: local lifecycle hooks / notification integration for tools like peon-ping","date":"2026-03-07"},{"url":"https://github.com/pingdotgg/t3code/discussions/19534","title":"Support MCP Events in T3's MCP server","date":"2026-10-14"}],"demand":{"basis":"discussion","upvotes":5,"comments":3,"url":"https://github.com/pingdotgg/t3code/discussions/6933","as_of":"2026-11-19"},"mount_today":{"type":"standalone-page","note":"The docs say an outside agent connected over MCP can read projects and threads and follow a thread with t3_thread_wait, so a small helper that watches threads and posts a webhook or plays a sound may work. Untested; a built-in event hook would still need a plugin API.","note_zh":"文档说，经 MCP 连入的外部 Agent 能读取项目和线程，并用 t3_thread_wait 跟踪线程，所以一个监视线程、再发 webhook 或播放声音的小助手可能行得通。未测试；内置的事件钩子仍需要插件 API。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/outside-agents.md"},"review":{"value":"low","reasons":"MCP Events in docs/user/outside-agents.md (read 2026-11-23) cover the third source and most of the outbound turn/thread callback: bots can poll, stream or receive webhooks. Discussion 6933 is still open (5 upvotes, 3 comments). What is left is a simple URL or local hook, which is a small core setting (inference), so plugin value is now low.","reasons_zh":"docs/user/outside-agents.md 里的 MCP Events（2026-11-23 核对）覆盖了第三条来源，以及外发回合/线程回调的大部分：机器人可以轮询、流式接收或收 webhook。讨论 6933 仍开放（5 个 upvote、3 条评论）。剩下的是简单 URL 或本地钩子，更像核心设置（推断），插件价值现为低。","as_of":"2026-11-23","action":"keep"},"status":"open"},{"slug":"preview-browser-login-fill","title":"Safe login fill for the preview browser","title_zh":"预览浏览器里的安全登录填充","problem":"Two posts describe testing apps that need a login in the preview browser: one asks for project-scoped test credential profiles that agents can use without the secret crossing the model boundary, the other for a password manager (Enpass) extension. The official docs describe a 1Password secret provider and private secret requests; neither post is about that path. Counts not added.","problem_zh":"两条帖子描述了在预览浏览器里测试需要登录的应用：一条要求按项目保存测试凭据，让 Agent 使用时密钥不进入模型；另一条要求接入密码管理器（Enpass）扩展。官方文档有 1Password 密钥提供方和私密密钥请求，两条帖子说的都不是这条路径。数字不相加。","category":"other","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/7346","title":"Secure project-scoped credential profiles for preview-browser test logins","date":"2026-08-17"},{"url":"https://github.com/pingdotgg/t3code/discussions/30196","title":"Fill logins from Enpass in the preview browser","date":"2026-11-03"}],"demand":{"basis":"discussion","upvotes":7,"comments":5,"url":"https://github.com/pingdotgg/t3code/discussions/7346","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"No documented entry fills fields in the preview browser; untested whether the existing private secret requests (secrets.md) could carry it.","note_zh":"文档里没有往预览浏览器填字段的入口；现有的私密密钥请求（secrets.md）能否承载它没有测试。"},"review":{"value":"low","reasons":"7 and 5 upvotes in two posts that ask for different things (test credentials, a password-manager extension). docs/user cover secret providers and private secret requests (secrets.md) but not filling the preview browser; handling secrets safely makes it hard to build as a plugin (inference).","reasons_zh":"两条帖子分别 7 个和 5 个 upvote，要的是不同的东西（测试凭据、密码管理器扩展）。docs/user 有密钥提供方和私密密钥请求（secrets.md），但没有往预览浏览器填字段；要安全处理密钥，做成插件不容易（推断）。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"turn-stats-footer","title":"Compact per-turn stats footer","title_zh":"每回合的紧凑统计页脚","problem":"Asks for a small row under each response showing model and effort, tokens per second, token count, time to first token and tool-call count, so a long coding run is easy to audit. Single source.","problem_zh":"希望每条回复下面有一行小字，显示模型和强度、每秒 token 数、token 总数、首 token 时间和工具调用数，方便审计很长的编码过程。仅此一个来源。","category":"ui-surfaces","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/17967","title":"[Feature]: Add compact per-turn session stats footer","date":"2026-05-05"}],"demand":{"basis":"discussion","upvotes":9,"comments":11,"url":"https://github.com/pingdotgg/t3code/discussions/17967","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"No documented entry adds content to the message footer.","note_zh":"文档里没有往消息页脚加内容的入口。"},"review":{"value":"medium","reasons":"9 upvotes, 11 comments, single source. The data is informational and a per-message footer is a plain UI-hook plugin; docs/user describe no such footer.","reasons_zh":"9 个 upvote、11 条评论，仅此一个来源。内容只是信息展示，逐条消息的页脚是典型的界面钩子类插件；docs/user 没有这种页脚。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"pr-event-thread-wake","title":"Wake or snooze a thread on pull request events","title_zh":"按 PR 事件唤醒或暂缓线程","problem":"Asks for a snooze mode that keeps a thread out of the way until its linked pull request gets a review, comment, check result or conflict, and for waking a watched thread when the PR merges or a review bot reacts. Pull request watching exists in the docs; these are the waits it does not cover. Two posts, counts not added.","problem_zh":"希望有个“暂缓”模式，让线程在其关联的拉取请求收到评审、评论、检查结果或冲突之前不打扰你，并在 PR 合并或评审机器人有反应时唤醒被监视的线程。文档里已有拉取请求监视，这里要的是它没覆盖的等待。两条帖子，数字不相加。","category":"orchestration","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/16459","title":"Snooze a thread until its pull request changes","date":"2026-10-06"},{"url":"https://github.com/pingdotgg/t3code/discussions/16795","title":"Wake a watched PR's thread when it merges or closes, and when a review bot reacts","date":"2026-10-07"}],"demand":{"basis":"discussion","upvotes":18,"comments":8,"url":"https://github.com/pingdotgg/t3code/discussions/16459","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"The docs describe pull request watching that wakes the agent on checks, comments, reviews and conflicts and ends when the pull request merges or closes (source-control.md); they describe no snooze that only brings the thread back, and no wake on merge. An outside agent can read and message threads, but whether a helper could approximate this by polling pull requests was not tested.","note_zh":"文档描述的拉取请求监视会在检查、评论、评审和冲突时唤醒 Agent，在 PR 合并或关闭时结束（source-control.md）；没有描述只把线程唤回的暂缓，也没有合并时唤醒。外部 Agent 能读线程、发消息，但助手能否靠轮询拉取请求近似这个功能，没有测试。"},"review":{"value":"medium","reasons":"18 upvotes, 8 comments, plus a second post (4 upvotes). Pull request watching is already documented (source-control.md), so most of the ask extends a core feature; related to watch-command (inference).","reasons_zh":"18 个 upvote、8 条评论，另有一条帖子（4 个 upvote）。拉取请求监视已有文档（source-control.md），所以这条大部分是在扩展核心功能；与 watch-command 有关（推断）。","as_of":"2026-11-19","action":"keep"},"status":"open"},{"slug":"shared-mcp-servers","title":"Shared MCP servers for every provider and account","title_zh":"各提供方与账号共用的 MCP 服务器","problem":"With more than one provider account, each account keeps its own MCP configuration, so a server such as Linear is set up again for every account. Asks T3 to own a per-environment list of MCP servers and attach it to every provider session, with rules and skills as possible follow-ups. The author reports a working prototype. Single source.","problem_zh":"有多个提供方账号时，每个账号各自保存 MCP 配置，像 Linear 这样的服务器要为每个账号重配一遍。希望由 T3 保存一份按环境的 MCP 服务器列表，并挂到每个提供方会话上，规则和 Skill 可以之后再做。作者说已有可用的原型。仅此一个来源。","category":"skills-mcp","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/14118","title":"Environment-level MCP servers (and later rules/skills) shared by every provider and account","date":"2026-09-28"}],"demand":{"basis":"discussion","upvotes":37,"comments":15,"url":"https://github.com/pingdotgg/t3code/discussions/14118","as_of":"2026-11-23"},"mount_today":{"type":"needs-plugin-api","note":"The user docs read for this list describe MCP servers set up in each provider (composer.md); none describes an environment-level list shared across providers. Not checked exhaustively.","note_zh":"为这份清单读过的用户文档里，MCP 服务器都是在各提供方里配置的（composer.md）；没有哪条描述了跨提供方共用的环境级列表。没有穷尽检查。"},"review":{"value":"high","reasons":"37 upvotes and 15 comments from a single post (was 31 upvotes on 2026-11-19); the author reports a working prototype. docs/user still describe MCP servers per provider (composer.md), not an environment-level list (read 2026-11-23).","reasons_zh":"单条帖子 37 个 upvote、15 条评论（2026-11-19 时为 31 个 upvote），作者说已有可用的原型。docs/user 仍是各提供方各自配置 MCP 服务器（composer.md），没有环境级列表（2026-11-23 核对）。","as_of":"2026-11-23","action":"keep"},"status":"open"},{"slug":"secret-providers","title":"More secret providers, starting with Bitwarden","title_zh":"更多密钥提供方，先支持 Bitwarden","problem":"The Secrets settings read credentials from 1Password only. Two posts ask for Bitwarden: one to reference password-manager items in provider environment variables, the other to add Bitwarden Secrets Manager to the existing secret-provider system, and its author reports a local prototype. Counts not added.","problem_zh":"密钥设置目前只能从 1Password 读取凭据。两条帖子都要 Bitwarden：一条要求在提供方环境变量里引用密码管理器条目，另一条要求把 Bitwarden Secrets Manager 加进现有的密钥提供方体系，后者的作者说有本地原型。数字不相加。","category":"platform","sources":[{"url":"https://github.com/pingdotgg/t3code/discussions/14951","title":"Reference password-manager items (Bitwarden first) in provider environment variables","date":"2026-10-03"},{"url":"https://github.com/pingdotgg/t3code/discussions/34068","title":"Add Bitwarden Secrets Manager as a secret provider","date":"2026-11-10"}],"demand":{"basis":"discussion","upvotes":5,"comments":4,"url":"https://github.com/pingdotgg/t3code/discussions/14951","as_of":"2026-11-19"},"mount_today":{"type":"needs-plugin-api","note":"The docs name 1Password as the supported secret provider (docs/user/secrets.md) and describe no way to add another.","note_zh":"文档把 1Password 列为支持的密钥提供方（docs/user/secrets.md），没有描述添加其他提供方的办法。","docs":"https://github.com/pingdotgg/t3code/blob/main/docs/user/secrets.md"},"review":{"value":"medium","reasons":"5 upvotes (4 comments) and 4 upvotes in two posts, both asking for Bitwarden; docs/user name 1Password as the only secret provider (secrets.md). Provider drivers suit a plugin API, but demand is small.","reasons_zh":"两条帖子分别 5 个 upvote（4 条评论）和 4 个 upvote，都要 Bitwarden；docs/user 里 1Password 是唯一的密钥提供方（secrets.md）。提供方驱动适合放进插件 API，但需求不大。","as_of":"2026-11-19","action":"keep"},"status":"open"}]}</script>
